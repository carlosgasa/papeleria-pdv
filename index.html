<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Punto de venta e inventario para papelería" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Papelería André" />
    <title>Papelería André</title>
    <script>
      (function () {
        try {
          var tema = localStorage.getItem('papeleria-pos:tema');
          if (!tema) {
            tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
          }
          var raiz = document.documentElement;
          if (tema === 'oscuro') raiz.classList.add('dark');
          if (tema === 'pastel') raiz.setAttribute('data-theme', 'pastel');
        } catch {
          // localStorage no disponible; se usa el tema por defecto.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
